# Render Blueprint — Triển khai tự động Lingo API + PostgreSQL trên Render.com
# Hướng dẫn: Vào Render Dashboard -> New -> Blueprint -> Chọn repo Lingo-server.
services:
  - type: web
    name: lingo-server
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      - key: API_PREFIX
        value: /api
      - key: TRUST_PROXY_HOPS
        value: 1
      # Khi Client chạy trên Vercel (*.vercel.app) và API trên Render (*.onrender.com):
      # Để trống COOKIE_DOMAIN, bật COOKIE_SECURE=true và COOKIE_SAME_SITE=none.
      - key: COOKIE_DOMAIN
        value: ""
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      - key: DATABASE_URL
        fromDatabase:
          name: lingo-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: APP_URL
        value: https://lingo-server-4w6n.onrender.com
      - key: FRONTEND_URL
        value: https://lingo-client.vercel.app,https://lingo-client-dungntptitt-8448s-projects.vercel.app
      - key: GOOGLE_CLIENT_ID
        value: 523997367565-9fv1bv70cefrmsakg2tp4eifnvjo4su6.apps.googleusercontent.com
      - key: VAPID_PUBLIC_KEY
        value: BAN0eM8UO87LomPzbUDwSvC5C1nxuInllyddAOLbITXAZ9D05e26y9BAL22fiVXQ6OtyH1muTB2hDHKvEpNOnt4
      - key: VAPID_SUBJECT
        value: mailto:nguyendungsenpai109@gmail.com
      # Điền trên Render Dashboard khi tạo Blueprint (không lưu secret lên Git):
      - key: GEMINI_API_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false

databases:
  - name: lingo-db
    plan: free
    databaseName: lingo
    user: lingo
